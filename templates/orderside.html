
{% extends "layout.html" %}
{% block body %}
<!-- five column grid for layouit of the menu-->
<div class="five-column">
    {% for sideimage in results %}
<div class="card">
    <img src="{{ sideimage[1] }}" alt="{{ sideimage[0] }}">
    <p>{{ sideimage[0] }}</p>

    <form action="/add_to_cart" method="post">
        <input type="hidden" name="item_id" value="{{ sideimage[2] }}">
        <input type="hidden" name="item_type" value="side">
        <div class="quantity-controls">
            <label>Qty:
                <input type="number" name="quantity" class="qty-input" value="1" min="1" max="10">
            </label>
        </div>
        <button type="submit" class="button-class">Add to order</button>
    </form>
</div>
{% endfor %}

<a href="/cart" class="nextbutton">Cart</a>
</div>


{% endblock %}
