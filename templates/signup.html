{% extends "layout.html" %}
{% block body %}


<div class="login-container">

  {% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
    <div class="flash-messages">
      {% for category, message in messages %}
        <div class="flash-alert flash-{{ category }}">{{ message }}</div>
      {% endfor %}
    </div>

    {% if session.get('user')%}
    <script>
      setTimeout(function() {
          window.location.href = "/"; // redirects to home after 1.5 seconds
      }, 1500); 
    </script>
    {% endif %}
    
  {% endif %}
{% endwith %}

    <h1>Signup</h1>
    <form action="/signup" method="post" class="auth-form">
        <div class="auth-form-group">
            <label for="username">Username</label>
            <input type="text"  minlength="5" maxlength="25" name="username" class="auth-form-input" required>
        </div>
        <div class="auth-form-group">
            <label for="password">Password</label>
            <input type="password" minlength="5" name="password" class="auth-form-input" required>
        </div>
        <div class="auth-form-group">
            <label for="address">Address</label>
            <input type="text"  minlength="5" maxlength="50" name="address" class="auth-form-input" required>
        </div>
        <button type="submit" class="auth-form-button">Signup</button>
    </form>
</div>

{% endblock %}
